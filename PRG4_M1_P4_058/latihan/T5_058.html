<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warna Latar Acak</title>
</head>
<body>
    <h1>Pengubah Warna Latar Belakang - T5_058</h1>

    <button id="tombolWarna">Ubah Warna</button>

    <script>
        const tombol = document.getElementById('tombolWarna');

        // Menghasilkan warna acak dalam format rgb
        function warnaAcak() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Setiap tombol diklik, ubah warna latar belakang halaman
        tombol.addEventListener('click', function () {
            document.body.style.backgroundColor = warnaAcak();
        });
    </script>
</body>
</html>

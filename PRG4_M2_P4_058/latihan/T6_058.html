<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Transaksi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
        }

        .container {
            margin-top: 30px;
        }

        .table-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color: #343a40;
            color: white;
        }

        .form-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="table-container">
            <h1>Daftar Transaksi - P7_058</h1>
            <button id="addDataBtn" class="btn btn-primary mb-3">+ Add Data</button>

            <table id="transaksi-table" class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal</th>
                        <th>ID Produk</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="text-center">Data transaksi akan muncul di sini...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Form tambah transaksi -->
        <div class="form-container" id="formContainer">
            <h3 id="formTitle">Tambah Transaksi Baru</h3>
            <form id="addTransaksiForm">
                <div class="mb-3">
                    <label for="idProduk" class="form-label">Produk</label>
                    <select class="form-control" id="idProduk" required>
                        <option value="">Memuat produk...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="jumlah" class="form-label">Jumlah</label>
                    <input type="number" class="form-control" id="jumlah" min="1" required>
                </div>
                <button type="submit" class="btn btn-success" id="submitBtn">Submit</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const url = 'https://api.melangkah.my.id/transaksi/read.php';
        const createUrl = 'https://api.melangkah.my.id/transaksi/create.php';
        const updateUrl = 'https://api.melangkah.my.id/transaksi/update.php';
        const produkUrl = 'https://api.melangkah.my.id/produk/read.php';

        // Format angka ke Rupiah (tanpa desimal berlebih)
        function formatRupiah(angka) {
            return 'Rp' + Number(angka).toLocaleString('id-ID', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // ===== READ =====
        async function getTransaksi() {
            const tableBody = document.querySelector('#transaksi-table tbody');
            try {
                let response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                let data = await response.json();

                // Jaga-jaga jika API mengembalikan satu objek, bukan array
                if (!Array.isArray(data)) data = [data];

                tableBody.innerHTML = ''; // Kosongkan isi tabel

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada transaksi.</td></tr>';
                    return;
                }

                data.forEach(trx => {
                    const selesai = trx.status_transaksi === 'Selesai';
                    let row = `
                        <tr>
                            <td>${trx.id_transaksi}</td>
                            <td>${trx.tanggal_transaksi}</td>
                            <td>${trx.id_produk}</td>
                            <td>${trx.jumlah}</td>
                            <td>${formatRupiah(trx.total_harga)}</td>
                            <td>${trx.status_transaksi}</td>
                            <td>
                                <button class="btn btn-warning btn-sm"
                                    onclick="updateTransaksi(${trx.id_transaksi})"
                                    ${selesai ? 'disabled' : ''}>Selesaikan</button>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Gagal mengambil data transaksi:", error);
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Tidak dapat mengambil data transaksi.</td></tr>';
            }
        }

        // ===== Isi dropdown produk dari API produk =====
        async function loadProdukOptions() {
            const select = document.getElementById('idProduk');
            try {
                let response = await fetch(produkUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                let produk = await response.json();
                select.innerHTML = '<option value="">-- Pilih produk --</option>';
                produk.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.id} - ${p.nama_produk}</option>`;
                });
            } catch (error) {
                console.error("Gagal memuat produk:", error);
                select.innerHTML = '<option value="">Gagal memuat produk</option>';
            }
        }

        // ===== Tampil / sembunyikan form =====
        document.getElementById('addDataBtn').addEventListener('click', function () {
            document.getElementById('addTransaksiForm').reset();
            document.getElementById('formContainer').style.display = 'block';
        });

        document.getElementById('cancelBtn').addEventListener('click', function () {
            document.getElementById('formContainer').style.display = 'none';
        });

        // ===== CREATE =====
        document.getElementById('addTransaksiForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const transaksiData = {
                "id_produk": parseInt(document.getElementById('idProduk').value),
                "jumlah": parseInt(document.getElementById('jumlah').value)
            };

            try {
                let response = await fetch(createUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(transaksiData)
                });

                if (!response.ok) {
                    const teks = await response.text();
                    throw new Error(`Status ${response.status}: ${teks}`);
                }
                alert('Transaksi berhasil ditambahkan!');
                document.getElementById('formContainer').style.display = 'none';
                getTransaksi(); // Refresh daftar transaksi
            } catch (error) {
                console.error("Gagal menambahkan transaksi:", error);
                alert('Gagal menambahkan transaksi: ' + error.message);
            }
        });

        // ===== UPDATE (ubah status menjadi "Selesai") =====
        async function updateTransaksi(id) {
            if (!confirm('Ubah status transaksi ini menjadi Selesai?')) return;

            try {
                let response = await fetch(updateUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ "id_transaksi": id })
                });

                if (!response.ok) {
                    const teks = await response.text();
                    throw new Error(`Status ${response.status}: ${teks}`);
                }
                alert('Status transaksi berhasil diperbarui!');
                getTransaksi(); // Refresh daftar transaksi
            } catch (error) {
                console.error("Gagal memperbarui transaksi:", error);
                alert('Gagal memperbarui transaksi: ' + error.message);
            }
        }

        getTransaksi();
        loadProdukOptions();
    </script>
</body>

</html>
